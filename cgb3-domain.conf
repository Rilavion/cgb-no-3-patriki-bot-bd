server {
    server_name cgb3patriki.ru www.cgb3patriki.ru;
    root /var/www/html;
    index index.html;
    location = / { rewrite ^ /index.html break; }
    location = /index.html { return 301 /$is_args$args; }
    location = /composition { return 301 /team$is_args$args; }
    location = /composition.html { return 301 /team$is_args$args; }
    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8787/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 30s;
        client_max_body_size 25m;
    }
    location ^~ /media/ {
        alias /var/lib/cgb-storage/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
    location = /auth.js {
        try_files /auth.js =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location = /roles-engine.js {
        try_files /roles-engine.js =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location ~ ^/(database-config|database-loader|database-client)\.js$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }
    location ^~ /assets/ustav/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }
    location = /tests {
        try_files /tests.html =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    location ~ ^/(.+)\.html$ { return 301 /$1$is_args$args; }
    location / { try_files $uri $uri/ $uri.html =404; }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cgb3patriki.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cgb3patriki.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.cgb3patriki.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = cgb3patriki.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name cgb3patriki.ru www.cgb3patriki.ru;
    return 404; # managed by Certbot




}
